# Render Blueprint: New -> Blueprint -> select this repository.
services:
  - type: web
    name: shape-analytics
    runtime: python
    plan: free
    branch: main
    rootDir: shape-analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.9
